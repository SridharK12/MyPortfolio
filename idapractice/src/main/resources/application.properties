spring.application.name=idapractice

# ── Server ─────────────────────────────────────────────────────────────────
server.port=8080

# ── MySQL ──────────────────────────────────────────────────────────────────
# Credentials are NEVER hardcoded.
# Inject via environment variables in all environments (local, staging, prod).
# Local dev default shown after the colon — override with a .env file (gitignored).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/idadb}
spring.datasource.username=${DB_USERNAME:sridhar}
spring.datasource.password=${DB_PASSWORD:srid1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA ────────────────────────────────────────────────────────────────────
# NEVER use 'update' in production — it can silently drop columns.
# 'validate' checks the schema matches the entities and fails fast on mismatch.
# Schema is managed exclusively by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Flyway (versioned schema migrations) ───────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Kafka ──────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
# Embeds the Java type header so JsonDeserializer knows which class to materialise
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Consumer
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Security: only allow our own DTO package — prevents arbitrary class instantiation
spring.kafka.consumer.properties.spring.json.trusted.packages=com.idapractice.idapractice.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.idapractice.idapractice.dto.PaymentResponseDTO

# ── Actuator (health probes for Kubernetes) ─────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Expose DB and Kafka health indicators
management.health.db.enabled=true
management.health.kafka.enabled=true

# ── Outbox publisher ────────────────────────────────────────────────────────
# How often the outbox poller runs (milliseconds). Tune per latency requirements.
app.outbox.poll-delay-ms=5000

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.idapractice=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.kafka=WARN
