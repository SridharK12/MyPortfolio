# ===============================
# Application Configuration
# ===============================
spring.application.name=customer-api
server.port=8088

# ===============================
# Security / Gateway
# ===============================
gateway.secret=9f3a7c1d-very-secret-value

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sridhar
spring.datasource.password=srid1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate (Boot 2.7)
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Eureka Client Configuration
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Eureka Instance Configuration
# ===============================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ===============================
# Logging Configuration
# ===============================
logging.file.name=C:/sridhar/logs/customer-api.log
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.com.example.customerapi=DEBUG
logging.level.com.example.customerapi=TRACE

# ===============================
# Resilience4j Retry Configuration (Boot 2.x)
# ===============================
resilience4j.retry.instances.customerStatusRetry.max-attempts=3
resilience4j.retry.instances.customerStatusRetry.wait-duration=500ms
resilience4j.retry.instances.customerStatusRetry.enable-exponential-backoff=true
resilience4j.retry.instances.customerStatusRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.customerStatusRetry.retry-exceptions=\
org.springframework.web.client.ResourceAccessException,\
java.io.IOException
resilience4j.retry.instances.customerStatusRetry.ignore-exceptions=\
com.example.customerapi.exception.BusinessException

# ===============================
# Resilience4j Circuit Breaker Configuration
# ===============================
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.record-exceptions=\
org.springframework.web.client.ResourceAccessException,\
java.io.IOException,\
org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.customerStatusCircuitBreaker.ignore-exceptions=\
com.example.customerapi.exception.BusinessException

# ===============================
# Resilience4j Rate Limiter Configuration
# ===============================
resilience4j.ratelimiter.instances.customerStatusRateLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.customerStatusRateLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.customerStatusRateLimiter.timeout-duration=500ms

# ===============================
# Actuator Configuration (Boot 2.7)
# ===============================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans,threaddump,loggers
management.endpoint.health.show-details=always

management.health.db.enabled=true
management.health.diskspace.enabled=true

management.metrics.tags.application=customer-api

# ===============================
# Actuator Info
# ===============================
management.info.env.enabled=true
info.app.name=Customer API
info.app.description=Customer Management Service
info.app.version=1.0.0

eureka.instance.instance-id=${spring.application.name}:${server.port}